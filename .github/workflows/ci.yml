name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./prisma/ci.db
      AI_PROVIDER: demo
      DEMO_ACCOUNT_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
        env:
          DEMO_ACCOUNT_ENABLED: "true"
      - run: npm run platform:rehearse
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run platform:runtime-check
      - run: npx playwright install --with-deps chromium
      # Release acceptance runs against the production build above, behind
      # the loopback HTTPS harness, so secure cookies and origin checks apply.
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: "1"
          E2E_OUTPUT_DIR: test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: seedee-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/container-rehearsal.sh
      - run: docker build --target production --tag seedee-production-check .
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down --volumes
        if: always()
