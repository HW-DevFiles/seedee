services:
  web:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:${SEEDEE_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/app/data/seedee.db
      AI_PROVIDER: demo
      DEMO_ACCOUNT_ENABLED: "true"
      TRUST_PROXY_HOPS: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - seedee-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 18
volumes:
  seedee-data:
